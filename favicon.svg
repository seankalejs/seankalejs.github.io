<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Монограмма «IK». Буквы нарисованы штрихами, а не шрифтом: SVG-иконка
       не подгружает Google Fonts, а на 16 пикселях от начертания всё равно
       остаются только штрихи. Плашка зелёная, чтобы иконка читалась и в
       светлой, и в тёмной вкладке — на тёмной плашке она сливалась бы. -->
  <rect width="64" height="64" rx="14" fill="#33CC3E"/>
  <g stroke="#04120A" stroke-width="7" stroke-linecap="square" fill="none">
    <path d="M18 20V44"/>
    <path d="M34 20V44"/>
    <path d="M34 32L46 20"/>
    <path d="M34 32L46 44"/>
  </g>
</svg>
