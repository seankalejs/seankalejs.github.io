<!--
  Короткий адрес для английской версии: ikuz.me/en

  Это не копия страницы, а переход на /?lang=en. Копия означала бы правку
  текста в двух местах, и версии однажды разъехались бы — этой странице
  такое уже случалось.

  ВАЖНО: перенаправление только в <script>, без <meta http-equiv="refresh">.
  Проверено на живом Telegram 10 августа 2026: по meta refresh он проходит
  и берёт мета-теги с конечной страницы, то есть русские. JavaScript он не
  выполняет — значит, прочитает английские теги отсюда и остановится.
  По той же причине canonical указывает сам на себя, а не на /?lang=en:
  иначе он тоже уводит собирателя превью на русскую версию.

  Человек в браузере этой страницы не увидит: скрипт срабатывает сразу.
  Без JavaScript остаётся видимая ссылка ниже.
-->
